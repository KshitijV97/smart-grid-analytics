# Install once: pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^web/tsconfig.*\.json$ # tsconfig allows comments
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
        exclude: ^(docs|presentation)/
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Python (services/ml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^services/ml/
      - id: ruff-format
        files: ^services/ml/
  - repo: local
    hooks:
      - id: mypy
        name: mypy (services/ml)
        entry: bash -c 'cd services/ml && uv run mypy'
        language: system
        files: ^services/ml/.*\.py$
        pass_filenames: false

  # Go (services/api)
  # Needs golangci-lint v2 on PATH: https://golangci-lint.run/welcome/install/
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (services/api)
        entry: bash -c 'cd services/api && golangci-lint run ./...'
        language: system
        files: ^services/api/
        pass_filenames: false

  # Web (React / TypeScript)
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web)
        entry: bash -c 'cd web && npx prettier --check .'
        language: system
        files: ^web/
        pass_filenames: false
      - id: eslint
        name: eslint (web)
        entry: bash -c 'cd web && npx eslint .'
        language: system
        files: ^web/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: tsc
        name: tsc (web)
        entry: bash -c 'cd web && npx tsc -b'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false

  # Terraform
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/infra/terraform/.tflint.hcl]
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true, --tf-init-args=-backend=false]

  # Dockerfiles
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3018]
